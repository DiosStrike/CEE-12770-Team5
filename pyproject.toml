description = "A web-based acoustic anomaly detection system for HVAC motors using autoencoders and mel-spectrograms (12-770 Final Project)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gradio>=6.11.0",
    "ipykernel>=7.2.0",
    "librosa>=0.11.0",
    "numpy>=2.4.4",
    "scikit-learn>=1.8.0",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
]
